name: Build demo portable binaries

on:
  push:
    branches:
      - "**"
    tags:
      - "demo-v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            runner: windows-2025
            target: x86_64-pc-windows-msvc
          - name: macos-intel
            runner: macos-15-intel
            target: x86_64-apple-darwin
          - name: macos-apple-silicon
            runner: macos-15
            target: aarch64-apple-darwin

    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        working-directory: demo

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust target
        run: rustup target add ${{ matrix.target }}

      - name: Build application and room server
        run: cargo build --release --locked --target ${{ matrix.target }} --bins --example demo_controls_e2e

      - uses: actions/setup-node@v4
        if: runner.os == 'Windows'
        with:
          node-version: 22

      - name: Run headless room E2E on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./verification/Verify-RustOnlineRoom.ps1 -ServerPath "target/${{ matrix.target }}/release/live-code-room-server.exe"

      - name: Run demo-controls E2E on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./verification/Verify-DemoControls.ps1 -ProbePath "target/${{ matrix.target }}/release/examples/demo_controls_e2e.exe"

      - name: Run room-data migration E2E on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./verification/Verify-RustRoomMigration.ps1 -ServerPath "target/${{ matrix.target }}/release/live-code-room-server.exe"

      - name: Run library migration E2E on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./verification/Verify-RustMigration.ps1 -AppPath "target/${{ matrix.target }}/release/live-code-typer-demo.exe"

      - uses: msys2/setup-msys2@v2
        if: runner.os == 'Windows'
        id: mesa
        with:
          msystem: UCRT64
          update: true
          install: mingw-w64-ucrt-x86_64-mesa

      - name: Enable software OpenGL for desktop E2E
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          MSYS2_LOCATION: ${{ steps.mesa.outputs.msys2-location }}
        run: |
          $mesaBin = Join-Path $env:MSYS2_LOCATION 'ucrt64/bin'
          $appDirectory = (Resolve-Path 'target/${{ matrix.target }}/release').Path
          Copy-Item (Join-Path $mesaBin 'opengl32.dll') $appDirectory
          Add-Content -Path $env:GITHUB_PATH -Value $mesaBin
          Add-Content -Path $env:GITHUB_ENV -Value 'GALLIUM_DRIVER=llvmpipe'

      - name: Run Alt+1 background typing E2E on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./verification/Verify-RustDesktop.ps1 -AppPath "target/${{ matrix.target }}/release/live-code-typer-demo.exe" -ServerPath "target/${{ matrix.target }}/release/live-code-room-server.exe" -DemoHotkey

      - name: Package Windows binaries
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $folder = "dist/live-code-typer-demo-${{ matrix.name }}"
          New-Item -ItemType Directory -Path $folder -Force | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/live-code-typer-demo.exe" $folder
          Copy-Item "target/${{ matrix.target }}/release/live-code-room-server.exe" $folder
          Copy-Item README.md $folder
          Copy-Item packaging/windows/START-HERE.txt $folder
          Copy-Item packaging/windows/Run-LiveCodeTyper-Demo.cmd $folder
          Copy-Item packaging/windows/Start-Room-Server.cmd $folder
          New-Item -ItemType Directory -Path "$folder/portable-data" -Force | Out-Null
          Copy-Item packaging/windows/portable-data/README.txt "$folder/portable-data"
          ./verification/Verify-RoomLauncher.ps1 -LauncherPath "$folder/Start-Room-Server.cmd" -UseDefaultPort
          ./verification/Verify-RoomLauncher.ps1 -LauncherPath "$folder/Start-Room-Server.cmd"
          Compress-Archive -Path "$folder/*" -DestinationPath "dist/live-code-typer-demo-${{ matrix.name }}.zip"

      - name: Package macOS binaries
        if: runner.os == 'macOS'
        shell: bash
        run: |
          folder="dist/live-code-typer-demo-${{ matrix.name }}"
          app="$folder/LiveCode Typer Demo.app"
          mkdir -p "$app/Contents/MacOS" "$folder/portable-data"
          cp "target/${{ matrix.target }}/release/live-code-typer-demo" "$app/Contents/MacOS/live-code-typer-demo"
          chmod +x "$app/Contents/MacOS/live-code-typer-demo"
          cp "target/${{ matrix.target }}/release/live-code-room-server" "$folder/live-code-room-server"
          chmod +x "$folder/live-code-room-server"
          cp README.md packaging/macos/START-HERE.txt packaging/macos/Start-Room-Server.command "$folder/"
          cp packaging/macos/portable-data/README.txt "$folder/portable-data/"
          chmod +x "$folder/Start-Room-Server.command"
          cat > "$app/Contents/Info.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleExecutable</key><string>live-code-typer-demo</string>
            <key>CFBundleIdentifier</key><string>org.livecodetyper.demo</string>
            <key>CFBundleName</key><string>LiveCode Typer Demo</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleVersion</key><string>0.4.0</string>
            <key>LSMinimumSystemVersion</key><string>12.0</string>
            <key>NSHighResolutionCapable</key><true/>
          </dict>
          </plist>
          PLIST
          codesign --force --deep --sign - "$app"
          codesign --verify --deep --strict "$app"
          tar -czf "dist/live-code-typer-demo-${{ matrix.name }}.tar.gz" -C dist "live-code-typer-demo-${{ matrix.name }}"

      - uses: actions/upload-artifact@v4
        with:
          name: live-code-typer-demo-${{ matrix.name }}
          path: demo/dist/live-code-typer-demo-${{ matrix.name }}.*
          if-no-files-found: error
          retention-days: 14

  release:
    if: startsWith(github.ref, 'refs/tags/demo-v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Publish downloadable release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          tag="$GITHUB_REF_NAME"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" release-assets/* --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$tag" release-assets/* --title "LiveCode Typer demo $tag" --generate-notes --repo "$GITHUB_REPOSITORY"
          fi
